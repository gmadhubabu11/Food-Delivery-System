<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Order Tracking Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; font-family: monospace; }
    button { margin-top: 12px; padding: 9px 18px; cursor: pointer; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px 16px; margin-top: 16px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; background: #e8f0fe; font-weight: 600; }
    #conn.ok { color: #0a7d2c; } #conn.bad { color: #b00020; }
    pre { background: #f6f6f6; padding: 10px; max-height: 260px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Live Order Tracking Test</h1>
  <label for="token">Access token</label>
  <input id="token" placeholder="paste the JWT from POST /auth/login">
  <label for="orderId">Order ID</label>
  <input id="orderId" type="number" min="1" placeholder="e.g. 1">
  <button id="connectBtn">Connect</button>
  <button id="disconnectBtn" disabled>Disconnect</button>
  <p>Connection: <strong id="conn" class="bad">disconnected</strong></p>

  <div class="card">
    <div>Status: <span id="status" class="badge">-</span></div>
    <p id="message"></p>
    <p>Order: <span id="orderNo">-</span></p>
    <p>Partner: <span id="partnerName">-</span> (<span id="vehicle">-</span>)</p>
    <p>Partner location: <span id="loc">-</span></p>
    <p>Distance remaining: <span id="dist">-</span> km &nbsp;|&nbsp; ETA: <span id="eta">-</span> min</p>
  </div>

  <h3>Raw events</h3>
  <pre id="log"></pre>

  <script>
    let ws = null;
    const $ = (id) => document.getElementById(id);

    function setConn(text, ok) {
      $("conn").textContent = text;
      $("conn").className = ok ? "ok" : "bad";
    }

    function render(d) {
      if (d.status) $("status").textContent = d.status;
      $("message").textContent = d.message || "";
      if (d.order_number) $("orderNo").textContent = d.order_number;
      if (d.partner) {
        $("partnerName").textContent = d.partner.name || "-";
        $("vehicle").textContent = [d.partner.vehicle_type, d.partner.vehicle_number].filter(Boolean).join(" ");
        $("loc").textContent = d.partner.latitude != null
          ? d.partner.latitude.toFixed(6) + ", " + d.partner.longitude.toFixed(6) : "not shared yet";
      }
      if (d.distance_remaining_km != null) $("dist").textContent = d.distance_remaining_km;
      if (d.eta_minutes != null) $("eta").textContent = d.eta_minutes;
    }

    $("connectBtn").onclick = () => {
      const token = $("token").value.trim();
      const orderId = $("orderId").value.trim();
      if (!token || !orderId) { alert("Enter token and order id"); return; }
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${scheme}://${location.host}/ws/orders/${orderId}?token=${encodeURIComponent(token)}`);
      ws.onopen = () => { setConn("connected", true); $("connectBtn").disabled = true; $("disconnectBtn").disabled = false; };
      ws.onmessage = (e) => {
        $("log").textContent = new Date().toLocaleTimeString() + "  " + e.data + "\n" + $("log").textContent;
        try { render(JSON.parse(e.data)); } catch (err) { /* ignore */ }
      };
      ws.onclose = (e) => {
        setConn("disconnected (" + e.code + (e.reason ? ": " + e.reason : "") + ")", false);
        $("connectBtn").disabled = false; $("disconnectBtn").disabled = true;
      };
      ws.onerror = () => setConn("error", false);
    };
    $("disconnectBtn").onclick = () => { if (ws) ws.close(); };
  </script>
</body>
</html>
